name: Déploiement GitHub Pages

# Publie le site sur la branche gh-pages, servie par GitHub Pages.
# (La création de la branche gh-pages active automatiquement Pages sur un dépôt public.)
on:
  push:
    branches:
      - main
      - claude/deploy-site-backend-mq7wpv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,supabase'
